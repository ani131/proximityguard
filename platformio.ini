[env]
platform = https://github.com/norandomtechie/platform-raspberrypi#feature/proton-picosdk-support
board = proton
framework = picosdk
build_flags = -DPICO_RP2350A=0
build_src_flags = -O0
debug_tool = picoprobe
upload_protocol = picoprobe
monitor_speed = 115200

[env:sensor]
build_src_filter = +<sensor.c> +<protocol.c>

[env:display]
build_src_filter = +<display.c> +<protocol.c> +<audio.c> +<lcd.c>
